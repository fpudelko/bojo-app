name: Booking System Extractor (website → Claude)

# Reads HTML from each venue's website and uses Claude to detect the booking
# system type (phone / email / own system / external platform like Hally/Booksy).
# NO web search — Claude only reads the fetched HTML, so it's very cheap.
#
# Run AFTER enrich.py has had a chance to find website URLs for venues.
# Writes to field_outreach: booking_system, booking_url, booking_provider.
#
# Required secrets:
#   ANTHROPIC_API_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maks. obiektów (0 = wszystkie ze stroną WWW)'
        default: '0'
        required: false
        type: string
      dry_run:
        description: 'Tryb podglądu — nic nie zapisuje'
        default: true
        required: false
        type: boolean
      reprocess:
        description: 'Przetworz ponownie już przeanalizowane'
        default: false
        required: false
        type: boolean
      model:
        description: 'Model Claude (pusty = haiku 4.5)'
        default: ''
        required: false
        type: string

jobs:
  enrich-booking:
    name: Booking (${{ inputs.dry_run == true && 'DRY RUN' || 'ZAPIS' }}, limit=${{ inputs.limit }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--limit ${{ inputs.limit }} --concurrency 2"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.reprocess }}" = "true" ]; then
            ARGS="$ARGS --all"
          fi
          if [ -n "${{ inputs.model }}" ]; then
            ARGS="$ARGS --model ${{ inputs.model }}"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run booking enrichment
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_booking.py ${{ steps.args.outputs.args }}
