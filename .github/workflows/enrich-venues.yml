name: AI Venue Enrichment (Claude)

# Uruchamiany ręcznie z zakładki Actions w GitHubie (działa też z telefonu).
# Dla każdej lokalizacji (adres) wyszukuje w sieci dane kontaktowe i sposób
# rezerwacji, a wyniki wgrywa do Supabase (fields + field_outreach).
#
# Wymagane sekrety repozytorium:
#   ANTHROPIC_API_KEY           (console.anthropic.com → API keys)
#   SUPABASE_URL                (np. https://xxxx.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY   (Supabase → Settings → API → service_role)
#
# ⚠ KOSZT: web search ≈ $10/1000 wyszukań. Uruchom najpierw z dry_run=true
#   i małym limitem, żeby sprawdzić jakość wyników zanim puścisz całość.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maks. grup adresowych do przetworzenia (0 = wszystkie)'
        default: '10'
        required: false
        type: string
      dry_run:
        description: 'Tryb podglądu — wypisuje wyniki, nic nie zapisuje'
        default: true
        required: false
        type: boolean
      require_empty:
        description: 'Tylko lokalizacje bez telefonu I e-maila (tańsze)'
        default: false
        required: false
        type: boolean
      model:
        description: 'Model Claude (haiku = tani, sonnet = dokładniejszy)'
        default: 'claude-haiku-4-5-20251001'
        required: false
        type: choice
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6
      concurrency:
        description: 'Równoległe zapytania (1 = bezpieczne dla 50k TPM, 2-3 jeśli masz wyższy limit)'
        default: '1'
        required: false
        type: string
      max_searches:
        description: 'Maks. wyszukań web na grupę adresową (2 = szybsze/tańsze, 4 = więcej danych)'
        default: '2'
        required: false
        type: string


jobs:
  enrich:
    name: Wzbogacanie danych (${{ inputs.dry_run == true && 'DRY RUN' || 'ZAPIS' }}, limit=${{ inputs.limit }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--limit ${{ inputs.limit }} --concurrency ${{ inputs.concurrency }} --max-searches ${{ inputs.max_searches }} --model ${{ inputs.model }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.require_empty }}" = "true" ]; then
            ARGS="$ARGS --require-empty"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run enrichment
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich.py ${{ steps.args.outputs.args }}
