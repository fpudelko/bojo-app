name: Backfill lokalizacji boisk (city/voivodeship)

# Wypełnia fields.city / fields.voivodeship dla boisk zaimportowanych wcześniej
# z OSM (scraper/import_osm_pbf.py), bo import liczył miejscowość tylko po to,
# żeby wkleić ją w wolny tekst `address` — nigdy nie zapisywał jej jako osobnej
# kolumny (patrz migracja 112_seo_tier_i_lokalizacja.sql). Bez tego backfillu
# wszystkie boiska zostają w Tier 3 (noindex) na zawsze, bo `oblicz_seo_tier()`
# wymaga wypełnionego `city`.
#
# Ten sam kształt co import-osm-polska.yml — jedno województwo na job, bo
# Geofabrik nie lubi zbyt wielu równoległych pobrań, i jeden padnięty region
# nie blokuje pozostałych piętnastu.
#
# ZACZNIJ OD dry_run=true. Dostaniesz raporty bez dotykania bazy.
#
# JEDNO WOJEWÓDZTWO: ustaw `region`. Podsumowanie na dole od początku radziło
# „uruchom workflow dla pojedynczych regionów", ale nie było czym — matryca
# była wpisana na sztywno i szła zawsze przez wszystkie szesnaście. Przy
# powtórce po poprawce w skrypcie albo po jednym padniętym regionie znaczyło
# to piętnaście niepotrzebnych pobrań z Geofabrika.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Województwo (albo wszystkie)'
        default: 'wszystkie'
        required: false
        type: choice
        options:
          - wszystkie
          - dolnoslaskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - lodzkie
          - malopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - slaskie
          - swietokrzyskie
          - warminsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
      dry_run:
        description: 'Tylko raporty — nic nie zapisuje'
        default: true
        required: false
        type: boolean
      rownolegle:
        description: 'Ile województw naraz (Geofabrik nie lubi zbyt wielu naraz)'
        default: '4'
        required: false
        type: choice
        options: ['2', '4', '8']

jobs:
  # Matryca liczona w osobnym zadaniu, bo `strategy.matrix` nie przyjmuje
  # warunku — przyjmuje wyłącznie gotową listę albo `fromJSON` z czegoś, co
  # już policzył ktoś przed nim. Stąd ten jeden krok: zamienia wybór z pola
  # `region` na listę jedno- albo szesnastoelementową.
  regiony:
    name: Wybór regionów
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.wybor.outputs.lista }}
    steps:
      - id: wybor
        env:
          # Przez zmienną środowiskową, nie wprost w skrypcie: wartość z pola
          # `choice` jest wprawdzie pilnowana przez GitHuba, ale wklejanie
          # danych wejściowych do powłoki to nawyk, którego nie warto mieć.
          REGION: ${{ inputs.region }}
        run: |
          if [ -z "$REGION" ] || [ "$REGION" = "wszystkie" ]; then
            LISTA='["dolnoslaskie","kujawsko-pomorskie","lubelskie","lubuskie","lodzkie","malopolskie","mazowieckie","opolskie","podkarpackie","podlaskie","pomorskie","slaskie","swietokrzyskie","warminsko-mazurskie","wielkopolskie","zachodniopomorskie"]'
          else
            LISTA=$(jq -nc --arg r "$REGION" '[$r]')
          fi
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Regiony do przetworzenia: $LISTA"

  backfill:
    name: ${{ matrix.region }}
    needs: regiony
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.rownolegle || '4') }}
      matrix:
        region: ${{ fromJSON(needs.regiony.outputs.lista) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Zależności
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Backfill ${{ matrix.region }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backfill_lokalizacja.py \
            --region "${{ matrix.region }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

  podsumowanie:
    name: Podsumowanie
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wynik
        run: |
          echo "Backfill zakończony ze statusem: ${{ needs.backfill.result }}"
          echo ""
          echo "Raporty per województwo są w logach zadań wyżej."
          if [ "${{ needs.backfill.result }}" != "success" ]; then
            echo ""
            echo "Część województw padła. Nie trzeba powtarzać całości:"
            echo "uruchom workflow ponownie z polem 'region' ustawionym na ten jeden."
          fi
