name: Migracje

# Uruchamia BRAKUJĄCE migracje SQL na bazie dev albo produkcyjnej.
#
# ─────────────────────────────────────────────────────────────────────────────
# CO SIĘ DZIEJE SAMO, A CO WYMAGA KLIKNIĘCIA
#
#   push na DOWOLNĄ gałąź, który dotyka supabase/migrations/**  →  DEV, wszystko
#   merge do mastera                                            →  DEV, wszystko
#                                                               →  PRODUKCJA, tylko BEZPIECZNE
#   ręczne uruchomienie (Actions → Run workflow)                →  dev albo PRODUKCJA, wszystko
#
# DLACZEGO JUŻ Z GAŁĘZI, A NIE DOPIERO PO MERGE'U: Vercel stawia podgląd dla
# każdego PR-a i celuje nim w bazę dev. Dopóki migracja czekała na merge,
# podgląd PR-a z migracją pokazywał aplikację, której baza nie zna — czyli
# dokładnie to, czego podgląd ma nie robić.
#
# CENĄ jest jedna baza dev zbierająca zmiany z wielu gałęzi. `migruj.sh`
# ZATRZYMUJE się na trzech stanach, które z tego wynikają (poprawiona
# migracja, która już poszła; kolizja numerów między gałęziami; schemat
# z porzuconego PR-a), a wyjściem z każdego z nich jest reset_dev niżej.
# Dev nie jest cenny — cenna jest jego zgodność z repo.
#
# PRODUKCJA: PODZIAŁ PRZEBIEGA PO RYZYKU, NIE PO ŚRODOWISKU
#
# Do 2026-09-22 stało tu, że produkcja nigdy nie dzieje się sama. Było to zbyt
# grube cięcie: 148 ze 155 migracji w tym repo tylko DOKŁADA rzeczy (kolumna,
# tabela, polityka, funkcja, indeks), czyli nie umie zepsuć danych, których
# jeszcze nie ma. Kazanie człowiekowi klikać przy każdej z nich uczy go klikać
# bez patrzenia, a wtedy ochrona przestaje działać dokładnie wtedy, gdy jest
# potrzebna. Do tego produkcja zostawała w tyle za kodem, który już poszedł na
# Vercela, i aplikacja rzucała błędem o nieznanej kolumnie.
#
# Dziś `scripts/ryzyko-migracji.mjs` czyta każdy plik i dzieli:
#
#   DOKŁADA (kolumna, tabela, polityka, funkcja, indeks)  →  automat
#   KASUJE albo PRZEPISUJE W MIEJSCU                      →  klik
#     DROP TABLE/SCHEMA/COLUMN/TYPE, TRUNCATE, DELETE FROM,
#     ALTER COLUMN … TYPE, RENAME COLUMN/TO, SET NOT NULL
#
# Autor może DOŁOŻYĆ `-- RECZNA: powód` w nagłówku pliku, gdy wie coś, czego
# skaner nie zobaczy (długi backfill blokujący tabelę). Znacznika odwrotnego
# nie ma i nie będzie: byłby furtką, przez którą wyjdzie każdy DROP.
#
# Zadanie produkcyjne przy merge'u woła `--tylko-bezpieczne` i ZATRZYMUJE SIĘ
# przed pierwszą ręczną, razem z całą resztą za nią — bo migracji nie da się
# przeskoczyć. Co czeka, wypisuje w logu i w podsumowaniu.
#
# Ręczne uruchomienie (Actions → Run workflow → produkcja) puszcza WSZYSTKO
# i jest przypięte do środowiska `produkcja`, czyli może mieć „Required
# reviewers". To jest ten moment, w którym ktoś patrzy na `DROP COLUMN`.
#
# KOLEJNOŚĆ, KTÓREJ WARTO SIĘ TRZYMAĆ: dev po merge'u (dzieje się sam) →
# sprawdzenie, że podgląd działa → produkcja jednym kliknięciem.
#
# ─────────────────────────────────────────────────────────────────────────────
# WYMAGANE SEKRETY
#
#   SUPABASE_DB_URL_DEV    adres do projektu BojoDev, rola z prawem DDL
#   SUPABASE_DB_URL_PROD   adres do produkcji, rola z prawem DDL
#
# To NIE jest ta sama rola co `SUPABASE_DB_URL_RO` z `sql.yml` — tamta ma
# wyłącznie SELECT i ma taka zostać. Instrukcja: supabase/migrations/README.md
#
# PIERWSZE URUCHOMIENIE na bazie, która ma już schemat, zatrzyma się z prośbą
# o `--oznacz-do` — patrz nagłówek `scripts/migruj.sh`. To celowe.

on:
  # Jeden wyzwalacz `push` dla dwóch przypadków, bo GitHub nie przyjmuje
  # drugiego klucza `push`. Co z tego wynika, rozstrzyga krok „Ustal tryb":
  #   master                  → dev, zapis
  #   claude/migracje/**      → dev, TYLKO PODGLĄD
  #
  # Gałąź robocza jest tu po to, żeby agent pracujący w repo mógł sprawdzić,
  # co pójdzie, bez klikania przez człowieka — ten sam wzorzec co `sql.yml`:
  # token agenta nie ma prawa odpalać workflowów przez API, więc push jest
  # jedynym wyzwalaczem, który kontroluje sam.
  # PUŁAPKA PRZY GAŁĘZI ROBOCZEJ: push, który nie niesie NOWEGO commita (np.
  # ten sam commit pchnięty pod drugą nazwą), nie ma zmienionych plików, więc
  # filtr `paths` nie ma czego dopasować i workflow nie rusza. Żeby wywołać
  # podgląd, gałąź musi dostać własny commit dotykający jednej z tych ścieżek.
  push:
    branches: ['**']
    paths:
      - 'supabase/migrations/**'
      - 'scripts/migruj.sh'
      - 'scripts/sprawdz-adres-bazy.sh'
      - '.github/workflows/migracje.yml'

  workflow_dispatch:
    inputs:
      srodowisko:
        description: 'Na której bazie'
        required: true
        default: dev
        type: choice
        options: [dev, produkcja]
      wykonaj:
        description: 'Zapisz zmiany (bez tego tylko podgląd)'
        required: false
        default: false
        type: boolean
      oznacz_do:
        description: 'Backfill: oznacz migracje do tego numeru jako już zastosowane (z „Zapisz zmiany" od razu puszcza resztę)'
        required: false
        type: string
      reset_dev:
        description: 'RESET DEV: skasuj schemat public i postaw go od 001 (tylko dev, NIGDY produkcja)'
        required: false
        default: false
        type: boolean

# Dwa przebiegi na tej samej bazie nie mają się ścigać. Skrypt trzyma jeszcze
# blokadę doradczą w samej bazie, ale lepiej nie doprowadzać do sytuacji,
# w której jeden czeka na drugiego przez dziesięć minut.
concurrency:
  group: migracje-${{ inputs.srodowisko || 'dev' }}
  cancel-in-progress: false

jobs:
  migracje:
    name: ${{ inputs.srodowisko || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Środowisko `produkcja` wpina bramkę zatwierdzania (Settings →
    # Environments → produkcja → Required reviewers). Dla `dev` nazwa jest
    # nieużywana, więc nic nie blokuje.
    environment: ${{ inputs.srodowisko == 'produkcja' && 'produkcja' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Ustal tryb
        id: tryb
        run: |
          set -euo pipefail
          SRODOWISKO="${{ inputs.srodowisko || 'dev' }}"

          # Reset rozstrzyga się przed wszystkim innym i NIGDY nie dotyczy
          # produkcji. Odmowa jest twarda, a nie ciche zignorowanie pola:
          # człowiek, który zaznaczył reset przy wybranej produkcji, chciał
          # czegoś, czego nie zrobimy, i ma się o tym dowiedzieć.
          if [ "${{ inputs.reset_dev }}" = "true" ]; then
            if [ "$SRODOWISKO" = "produkcja" ]; then
              echo "::error::reset_dev NIE działa na produkcji. Odznacz jedno albo drugie."
              exit 1
            fi
            ARG="--reset"
            SRODOWISKO="dev"
          # Push na gałąź roboczą APLIKUJE na dev — od 2026-09-22. Wcześniej
          # był to sam podgląd, przez co PR z migracją miał podgląd Vercela
          # uderzający w bazę bez jego schematu. Podgląd bez zapisu został
          # jako ręczne uruchomienie bez „Zapisz zmiany".
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "master" ]; then
            ARG="--wykonaj"
            SRODOWISKO="dev"
          elif [ -n "${{ inputs.oznacz_do }}" ]; then
            # Backfill sam w sobie nic nie uruchamia, więc bez tego trzeba było
            # klikać Run workflow DWA razy: raz żeby zapisać dziennik, drugi raz
            # żeby puścić to, co z niego wynika. Z zaznaczonym „Zapisz zmiany"
            # robimy oba kroki po kolei w jednym przebiegu — decyzja i tak
            # należy do klikającego, zmienia się tylko liczba kliknięć.
            ARG="--oznacz-do ${{ inputs.oznacz_do }}"
            if [ "${{ inputs.wykonaj }}" = "true" ]; then
              POTEM="--wykonaj"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Merge do mastera: dev dostaje migracje od razu, bo baza dev, która
            # została w tyle, jest gorsza niż jej brak — podgląd PR-a wygląda
            # wtedy na zepsuty, choć zepsuty jest tylko schemat.
            ARG="--wykonaj"
            SRODOWISKO="dev"
          elif [ "${{ inputs.wykonaj }}" = "true" ]; then
            ARG="--wykonaj"
          else
            ARG="--podglad"
          fi

          echo "arg=$ARG"               >> "$GITHUB_OUTPUT"
          echo "potem=${POTEM:-}"        >> "$GITHUB_OUTPUT"
          echo "srodowisko=$SRODOWISKO" >> "$GITHUB_OUTPUT"
          echo "Tryb: $ARG${POTEM:+, potem $POTEM} · baza: $SRODOWISKO"

      - name: Uruchom
        env:
          DB_URL_DEV:  ${{ secrets.SUPABASE_DB_URL_DEV }}
          DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.tryb.outputs.srodowisko }}" = "produkcja" ]; then
            SEKRET="SUPABASE_DB_URL_PROD"
            SUROWY="$DB_URL_PROD"
          else
            SEKRET="SUPABASE_DB_URL_DEV"
            SUROWY="$DB_URL_DEV"
          fi

          # Ta sama kontrola i to samo maskowanie hasła co w `sql.yml` — jeden
          # plik, żeby dwie kopie nie rozjechały się akurat w miejscu, w którym
          # rozjazd znaczy „hasło w publicznym logu".
          ADRES="$(DB_URL="$SUROWY" ./scripts/sprawdz-adres-bazy.sh "$SEKRET")"

          if [ "${{ steps.tryb.outputs.arg }}" = "--reset" ]; then
            # `DB_URL_PROD` jedzie obok celowo: reset-dev.sh porównuje z nim
            # adres, żeby nie dało się zresetować produkcji przez pomyłkę
            # w sekrecie. Porównanie, nie dopasowanie nazwy — adres poolera
            # niesie losowy identyfikator projektu, więc szukanie w nim słowa
            # „prod" niczego nie chroni.
            POTWIERDZAM_RESET=tak DB_URL="$ADRES" DB_URL_PROD="$DB_URL_PROD" \
              ./scripts/reset-dev.sh | tee /tmp/wynik.txt
          else
            DB_URL="$ADRES" ./scripts/migruj.sh ${{ steps.tryb.outputs.arg }} | tee /tmp/wynik.txt
          fi

          # Drugi krok istnieje tylko dla „backfill i od razu dogoń resztę".
          # `tee -a`, bo podsumowanie ma pokazać OBA przebiegi: sam dziennik bez
          # tego, co z niego wyniknęło, nie odpowiada na pytanie „czy poszło".
          if [ -n "${{ steps.tryb.outputs.potem }}" ]; then
            echo "" | tee -a /tmp/wynik.txt
            DB_URL="$ADRES" ./scripts/migruj.sh ${{ steps.tryb.outputs.potem }} | tee -a /tmp/wynik.txt
          fi

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### Migracje — ${{ steps.tryb.outputs.srodowisko }}"
            echo ""
            echo "Tryb: \`${{ steps.tryb.outputs.arg }}\`"
            echo ""
            echo '```'
            cat /tmp/wynik.txt 2>/dev/null || echo "(brak wyniku — przebieg padł wcześniej)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Produkcja przy merge'u: tylko to, co się nie cofa źle ──────────────────
  # OSOBNE ZADANIE, a nie gałąź w tamtym, z jednego powodu: tamto jest przypięte
  # do środowiska `produkcja`, gdy ktoś wybierze produkcję z listy. Środowisko
  # z „Required reviewers" ZATRZYMAŁOBY ten automat na zatwierdzeniu, czyli
  # zamieniło go z powrotem w klikanie. To zadanie środowiska nie ma, bo puszcza
  # wyłącznie migracje, które dokładają rzeczy.
  #
  # `if` pilnuje, żeby nie ruszyło przy ręcznym uruchomieniu: tamto jedzie
  # własną ścieżką i puszcza wszystko.
  produkcja-bezpieczne:
    name: produkcja (bezpieczne)
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Uruchom bezpieczne migracje
        env:
          DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -euo pipefail

          # Brak sekretu NIE jest błędem: produkcja bywa jeszcze nieskonfigurowana,
          # a czerwony znaczek na masterze z tego powodu nauczyłby wszystkich
          # ignorować czerwone znaczki na masterze.
          if [ -z "${DB_URL_PROD:-}" ]; then
            echo "SUPABASE_DB_URL_PROD nie jest ustawiony — pomijam produkcję."
            echo "Instrukcja: supabase/migrations/README.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ADRES="$(DB_URL="$DB_URL_PROD" ./scripts/sprawdz-adres-bazy.sh SUPABASE_DB_URL_PROD)"

          # Kod 3 znaczy „dziennik migracji pusty, potrzebny jednorazowy
          # backfill". To stan konfiguracji, nie awaria, więc traktujemy go
          # tak samo jak brak sekretu: wiadomość w podsumowaniu, zielony
          # przebieg. Inaczej master świeciłby czerwono przy KAŻDYM merge'u
          # aż do backfillu, czyli uczyłby ignorować czerwone znaczki.
          set +e
          DB_URL="$ADRES" ./scripts/migruj.sh --tylko-bezpieczne 2>&1 | tee /tmp/wynik.txt
          KOD=${PIPESTATUS[0]}
          set -e

          if [ "$KOD" = "3" ]; then
            echo "Produkcja czeka na jednorazowy backfill dziennika — patrz podsumowanie."
            exit 0
          fi
          exit "$KOD"

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### Migracje — produkcja (tylko bezpieczne)"
            echo ""
            cat /tmp/wynik.txt 2>/dev/null | sed 's/^/    /' || echo "    (brak wyniku)"
          } >> "$GITHUB_STEP_SUMMARY"
