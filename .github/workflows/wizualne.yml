name: Wizualne (informacyjne)

# Regresja wizualna — CELOWO OBOK GŁÓWNEJ BRAMKI.
#
# Ten workflow NIE blokuje deployu ani merge'a. Vercel wystawia podgląd gałęzi
# niezależnie i wcześniej; tutaj tylko porównujemy zrzuty ze wzorcami w repo
# i mówimy, co się zmieniło.
#
# Dlaczego osobno, a nie krokiem w `ci.yml`: zmiana wyglądu bywa zamierzona,
# a wtedy czerwona bramka blokująca merge zmusza do „naprawiania" czegoś, co
# jest w porządku. Zmiana wyglądu ma być DO PRZEJRZENIA, nie do naprawienia.
#
# ZADANIA NIGDY NIE ŚWIECĄ NA CZERWONO. Samo `continue-on-error` nie wystarcza:
# workflow owszem kończy się zielono, ale przy PR-ze i tak widać czerwony
# znaczek przy zadaniu — a to czyta się jak zepsuty build. Dlatego same testy
# lecą z `set +e`, a ich wynik jedzie dalej jako `outputs.wynik` i ląduje
# w komentarzu. Raport jest POMOCĄ DLA CHĘTNYCH, nie bramką.
#
# JAK TO WYGLĄDA Z TELEFONU
#   1. Workflow wystawia RAPORT — jedną stronę na PR, z obrazkami: nowe widoki
#      i trójki „wzorzec / teraz / różnica". Odnośnik ląduje w komentarzu do
#      PR-a. Wchodzisz, przewijasz, wychodzisz. Nic nie trzeba pobierać ani
#      pisać w odpowiedzi.
#   2. Raporty leżą na technicznej gałęzi `podglad-zrzutow` i kasują się same
#      po tygodniu (`.github/podglad-zrzutow.sh`).
#   3. Wzorce wchodzą do repo dopiero po nadaniu etykiety `zrzuty:zaakceptuj` —
#      wtedy workflow dopisze je do gałęzi PR-a i zobaczysz je w diffie.
#
# DOTYCZY TAK SAMO WIDOKÓW NOWYCH. Nic nie trafia do repo bez zatwierdzenia —
# pierwszy zrzut widoku jest właśnie tym, który warto obejrzeć, bo to on
# staje się wzorcem na zawsze. Szczegóły w `.github/dopisz-wzorce.sh`.

on:
  pull_request:
    # `labeled` NIE jest w domyślnej trójce (opened, synchronize, reopened) —
    # a bez niego nadanie etykiety `zrzuty:zaakceptuj` niczego nie uruchamiało.
    # Cały mechanizm akceptacji działał więc wyłącznie wtedy, gdy po etykiecie
    # przypadkiem doszedł jeszcze jakiś push. Instrukcja mówiła „nadaj etykietę
    # i gotowe", a w rzeczywistości nic się nie działo.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'frontend/**'
      - '.github/workflows/wizualne.yml'
  # Ręczne odpalenie, gdy chcesz sprawdzić bez otwierania PR-a.
  workflow_dispatch:

# Nowy push do tej samej gałęzi anuluje poprzedni przebieg — zrzuty ze starego
# kodu i tak nie mają wartości.
concurrency:
  group: wizualne-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # dopisanie wzorców przy akceptacji + gałąź z podglądem
  pull-requests: write   # komentarz z podsumowaniem

jobs:
  # Jedno miejsce, w którym rozstrzygamy: na czym pracujemy i czy akceptujemy.
  # Oba zadania niżej potrzebują tego samego, a `workflow_dispatch` nie ma
  # ani PR-a, ani etykiet — bez tego każde radziłoby sobie z tym osobno.
  kontekst:
    name: Kontekst
    runs-on: ubuntu-latest
    outputs:
      uruchamiac: ${{ steps.ustal.outputs.uruchamiac }}
      galaz:      ${{ steps.ustal.outputs.galaz }}
      pr:         ${{ steps.ustal.outputs.pr }}
      akceptuj:   ${{ steps.ustal.outputs.akceptuj }}
    steps:
      - id: ustal
        uses: actions/github-script@v7
        with:
          script: |
            const ustaw = (k, v) => core.setOutput(k, v);

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const etykieta = (pr.labels || []).some((l) => l.name === 'zrzuty:zaakceptuj');
              ustaw('uruchamiac', 'tak');
              ustaw('galaz', pr.head.ref);
              ustaw('pr', String(pr.number));
              ustaw('akceptuj', etykieta ? '1' : '0');
              return;
            }

            // workflow_dispatch — bez PR-a, tylko porównanie.
            ustaw('uruchamiac', 'tak');
            ustaw('galaz', context.ref.replace('refs/heads/', ''));
            ustaw('pr', '');
            ustaw('akceptuj', '0');

  zrzuty:
    name: Porównanie zrzutów
    needs: kontekst
    if: needs.kontekst.outputs.uruchamiac == 'tak'
    runs-on: ubuntu-latest
    # Bez tego czerwony wynik tego zadania blokowałby merge tak samo jak CI.
    # Informacja ma docierać komentarzem, nie blokadą.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.kontekst.outputs.galaz }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zależności
        working-directory: frontend
        run: npm ci

      - name: Przeglądarka
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build produkcyjny
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      # `set +e` i własne `exit 0`: to zadanie ma NIGDY nie świecić na czerwono.
      # Różnica w wyglądzie nie jest awarią, tylko informacją — a czerwony
      # znaczek przy PR-ze czyta się jak zepsuty build i każe „naprawiać" coś,
      # co bywa dokładnie zamierzone. Wynik jedzie dalej jako `outputs.wynik`
      # i ląduje w komentarzu.
      - name: Zrzuty
        id: test
        working-directory: frontend
        run: |
          set +e
          if [[ "${{ needs.kontekst.outputs.akceptuj }}" == "1" ]]; then
            npm run zrzuty:akceptuj
          else
            npm run zrzuty
          fi
          echo "wynik=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Raport i różnice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-raport
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Podgląd obrazków do komentarza
        id: podglad
        if: always() && needs.kontekst.outputs.pr != ''
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.kontekst.outputs.pr }}
        # Raport jest pomocą, nie bramką — jego awaria nie ma prawa niczego
        # zatrzymać ani zaczerwienić.
        run: ../.github/podglad-zrzutow.sh "widoki-publiczne" || true

      - name: Dopisz wzorce do gałęzi
        if: always() && needs.kontekst.outputs.pr != ''
        working-directory: frontend
        env:
          AKCEPTUJ: ${{ needs.kontekst.outputs.akceptuj }}
          GALAZ: ${{ needs.kontekst.outputs.galaz }}
        run: ../.github/dopisz-wzorce.sh "zrzutów" || true

      - name: Komentarz w PR
        if: always() && needs.kontekst.outputs.pr != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UDANE: ${{ steps.test.outputs.wynik }}
          AKCEPTUJ: ${{ needs.kontekst.outputs.akceptuj }}
          PR: ${{ needs.kontekst.outputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const czytaj = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
            await require(`${process.env.GITHUB_WORKSPACE}/.github/komentarz-zrzutow.js`)({
              github, context, core,
              znacznik: '🖼️',
              tytul: 'Widoki publiczne',
              udane: process.env.UDANE === '0',
              akceptacja: process.env.AKCEPTUJ === '1',
              obrazki: czytaj('frontend/podglad-zrzutow.md'),
              numer: Number(process.env.PR),
            });

  scenariusze:
    name: Scenariusze za logowaniem
    needs: kontekst
    if: needs.kontekst.outputs.uruchamiac == 'tak'
    runs-on: ubuntu-latest
    # Tak samo nieblokujące jak zrzuty widoków publicznych.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.kontekst.outputs.galaz }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stos Supabase, migracje i dane
        # Skrypt dopisuje NEXT_PUBLIC_SUPABASE_* do GITHUB_ENV, więc build
        # i testy niżej dostają adres oraz klucz lokalnej instancji.
        run: ./scripts/stos-lokalny.sh

      - name: Zależności
        working-directory: frontend
        run: npm ci

      - name: Przeglądarka
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build produkcyjny
        working-directory: frontend
        run: npm run build

      # Jak wyżej: to zadanie nigdy nie świeci na czerwono.
      - name: Scenariusze
        id: test
        working-directory: frontend
        run: |
          set +e
          if [[ "${{ needs.kontekst.outputs.akceptuj }}" == "1" ]]; then
            npm run scenariusze:akceptuj
          else
            npm run scenariusze
          fi
          echo "wynik=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Raport i różnice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenariusze-raport
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Podgląd obrazków do komentarza
        if: always() && needs.kontekst.outputs.pr != ''
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.kontekst.outputs.pr }}
        run: ../.github/podglad-zrzutow.sh "scenariusze-za-logowaniem" || true

      - name: Dopisz wzorce do gałęzi
        if: always() && needs.kontekst.outputs.pr != ''
        working-directory: frontend
        env:
          AKCEPTUJ: ${{ needs.kontekst.outputs.akceptuj }}
          GALAZ: ${{ needs.kontekst.outputs.galaz }}
        run: ../.github/dopisz-wzorce.sh "scenariuszy" || true

      - name: Komentarz w PR
        if: always() && needs.kontekst.outputs.pr != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UDANE: ${{ steps.test.outputs.wynik }}
          AKCEPTUJ: ${{ needs.kontekst.outputs.akceptuj }}
          PR: ${{ needs.kontekst.outputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const czytaj = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
            await require(`${process.env.GITHUB_WORKSPACE}/.github/komentarz-zrzutow.js`)({
              github, context, core,
              znacznik: '🎬',
              tytul: 'Scenariusze za logowaniem',
              udane: process.env.UDANE === '0',
              akceptacja: process.env.AKCEPTUJ === '1',
              obrazki: czytaj('frontend/podglad-zrzutow.md'),
              numer: Number(process.env.PR),
            });
