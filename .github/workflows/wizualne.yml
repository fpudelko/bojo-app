name: Wizualne (informacyjne)

# Regresja wizualna — CELOWO OBOK GŁÓWNEJ BRAMKI.
#
# Ten workflow NIE blokuje deployu ani merge'a. Vercel wystawia podgląd gałęzi
# niezależnie i wcześniej; tutaj tylko porównujemy zrzuty ze wzorcami w repo
# i mówimy, co się zmieniło.
#
# Dlaczego osobno, a nie krokiem w `ci.yml`: zmiana wyglądu bywa zamierzona,
# a wtedy czerwona bramka blokująca merge zmusza do „naprawiania" czegoś, co
# jest w porządku. Zmiana wyglądu ma być DO PRZEJRZENIA, nie do naprawienia.
#
# JAK PRZEJRZEĆ I ZAAKCEPTOWAĆ ZMIANĘ
#   1. Workflow pisze komentarz w PR z listą widoków, które się zmieniły.
#   2. Raport HTML (z podglądem „przed / po / różnica") leży w artefaktach.
#   3. Zgadzasz się ze zmianą? Nadaj PR-owi etykietę `zrzuty:zaakceptuj`.
#      Workflow wygeneruje nowe wzorce i dopisze je do gałęzi PR-a —
#      zobaczysz je wtedy w diffie jako zwykłą zmianę obrazków.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/wizualne.yml'
  # Ręczne odpalenie, gdy chcesz sprawdzić bez otwierania PR-a.
  workflow_dispatch:

# Nowy push do tej samej gałęzi anuluje poprzedni przebieg — zrzuty ze starego
# kodu i tak nie mają wartości.
concurrency:
  group: wizualne-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # dopisanie nowych wzorców przy akceptacji
  pull-requests: write   # komentarz z podsumowaniem

jobs:
  zrzuty:
    name: Porównanie zrzutów
    runs-on: ubuntu-latest
    # Bez tego czerwony wynik tego zadania blokowałby merge tak samo jak CI.
    # Informacja ma docierać komentarzem i artefaktem, nie blokadą.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zależności
        working-directory: frontend
        run: npm ci

      - name: Przeglądarka
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build produkcyjny
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      # Etykieta `zrzuty:zaakceptuj` → wzorce lecą od nowa i wracają do gałęzi.
      - name: Czy akceptujemy zmiany
        id: tryb
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'zrzuty:zaakceptuj') }}" == "true" ]]; then
            echo "akceptuj=1" >> "$GITHUB_OUTPUT"
          else
            echo "akceptuj=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Zrzuty
        id: test
        working-directory: frontend
        run: |
          if [[ "${{ steps.tryb.outputs.akceptuj }}" == "1" ]]; then
            npx playwright test --project=zrzuty-telefon --project=zrzuty-komputer --update-snapshots
          else
            npx playwright test --project=zrzuty-telefon --project=zrzuty-komputer
          fi

      - name: Raport i różnice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-raport
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Dopisz nowe wzorce do gałęzi
        if: steps.tryb.outputs.akceptuj == '1'
        working-directory: frontend
        run: |
          if [[ -z "$(git status --porcelain e2e/wzorce)" ]]; then
            echo "Wzorce bez zmian — nie ma czego dopisywać."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/wzorce
          git commit -m "test: zaakceptowane nowe wzorce zrzutów"
          git push origin HEAD:${{ github.head_ref }}

      - name: Komentarz w PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const udane = '${{ steps.test.outcome }}' === 'success';
            const akceptacja = '${{ steps.tryb.outputs.akceptuj }}' === '1';

            let tresc;
            if (akceptacja) {
              tresc = [
                '### 🖼️ Wzorce zrzutów zaktualizowane',
                '',
                'Etykieta `zrzuty:zaakceptuj` była nałożona, więc nowe wzorce trafiły na gałąź PR-a.',
                'Obejrzyj je w diffie — GitHub pokaże je z suwakiem „przed/po".',
                '',
                '**Zdejmij etykietę**, żeby kolejne przebiegi znowu porównywały, zamiast nadpisywać.',
              ].join('\n');
            } else if (udane) {
              tresc = [
                '### 🖼️ Widoki bez zmian',
                '',
                'Wszystkie zrzuty zgadzają się ze wzorcami — nic się wizualnie nie ruszyło.',
              ].join('\n');
            } else {
              tresc = [
                '### 🖼️ Widok się zmienił — do przejrzenia',
                '',
                'Zrzuty różnią się od wzorców. To **nie jest** błąd sam w sobie: zmiana może być',
                'dokładnie tym, co chciałeś zrobić.',
                '',
                '**Jak to obejrzeć:** w zakładce *Checks → Wizualne (informacyjne)* pobierz artefakt',
                '`zrzuty-raport`. Raport HTML pokazuje trzy obrazki obok siebie: wzorzec, stan obecny',
                'i podświetloną różnicę.',
                '',
                '**Zmiana jest w porządku?** Nadaj temu PR-owi etykietę `zrzuty:zaakceptuj`.',
                'Workflow wygeneruje nowe wzorce i dopisze je do gałęzi.',
                '',
                '_To zadanie nie blokuje merge\'a ani deployu._',
              ].join('\n');
            }

            const { data: komentarze } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const moj = komentarze.find((k) =>
              k.user.type === 'Bot' && k.body.includes('🖼️'));

            if (moj) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: moj.id, body: tresc,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: tresc,
              });
            }

  scenariusze:
    name: Scenariusze za logowaniem
    runs-on: ubuntu-latest
    # Tak samo nieblokujące jak zrzuty widoków publicznych.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stos Supabase, migracje i dane
        # Skrypt dopisuje NEXT_PUBLIC_SUPABASE_* do GITHUB_ENV, więc build
        # i testy niżej dostają adres oraz klucz lokalnej instancji.
        run: ./scripts/stos-lokalny.sh

      - name: Zależności
        working-directory: frontend
        run: npm ci

      - name: Przeglądarka
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build produkcyjny
        working-directory: frontend
        run: npm run build

      - name: Czy akceptujemy zmiany
        id: tryb
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'zrzuty:zaakceptuj') }}" == "true" ]]; then
            echo "akceptuj=1" >> "$GITHUB_OUTPUT"
          else
            echo "akceptuj=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scenariusze
        id: test
        working-directory: frontend
        run: |
          if [[ "${{ steps.tryb.outputs.akceptuj }}" == "1" ]]; then
            npm run scenariusze:akceptuj
          else
            # `--max-failures=1` nie jest oszczędnością czasu, tylko warunkiem
            # czytelności: przy 17 błędach Playwright kończy log listą nazw,
            # a treści pierwszego błędu (z tekstem strony) nie da się wtedy
            # odczytać z końcówki logu. Jeden błąd = jego pełna treść na końcu.
            npm run scenariusze -- --max-failures=1
          fi

      - name: Raport i różnice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenariusze-raport
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Dopisz nowe wzorce do gałęzi
        if: steps.tryb.outputs.akceptuj == '1'
        working-directory: frontend
        run: |
          if [[ -z "$(git status --porcelain e2e/wzorce)" ]]; then
            echo "Wzorce bez zmian."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.head_ref }} || true
          git add e2e/wzorce
          git commit -m "test: zaakceptowane wzorce scenariuszy"
          git push origin HEAD:${{ github.head_ref }}
