name: Pełne wzbogacanie danych (wszystkie źródła)

# Uruchamia wszystkie enrichery po kolei w optymalnej kolejności:
#   1. Nominatim       → adres, kod pocztowy, dzielnica          (całkowicie bezpłatne)
#   2. Google Places   → telefon, strona WWW, godziny otwarcia  (bezpłatne w limicie $200/mc)
#   3. Claude AI       → e-mail, sposób rezerwacji, AI-summary   (płatne: ~$10/1000 wyszukań)
#
# Kolejność ma znaczenie: Nominatim idzie pierwszy, żeby Claude dostał
# porządny adres ("ul. Roosevelta 18") zamiast "Poznań" — web search
# trafia wtedy w znacznie lepsze wyniki.
#
# Uruchom z dry_run=true przed pierwszym prawdziwym uruchomieniem!
#
# Wymagane sekrety:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_PLACES_API_KEY       (dla kroku Google)
#   ANTHROPIC_API_KEY           (dla kroku Claude)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tryb podglądu — nic nie zapisuje (zalecane przy pierwszym uruchomieniu)'
        default: true
        required: false
        type: boolean
      limit:
        description: 'Maks. obiektów / grup na każdy krok (0 = wszystkie)'
        default: '50'
        required: false
        type: string
      skip_geocode:
        description: 'Pomiń krok Nominatim (adresy/dzielnice)'
        default: false
        required: false
        type: boolean
      skip_google:
        description: 'Pomiń krok Google Places'
        default: false
        required: false
        type: boolean
      skip_claude:
        description: 'Pomiń krok Claude AI (najdroższy)'
        default: false
        required: false
        type: boolean
      claude_model:
        description: 'Model Claude dla ostatniego kroku'
        default: 'claude-haiku-4-5-20251001'
        required: false
        type: choice
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6

jobs:
  # ── KROK 1: Nominatim — adresy i dzielnice ───────────────────────────────
  geocode:
    name: "1/3 · Nominatim (adresy/dzielnice) ${{ inputs.dry_run == true && '(DRY RUN)' || '(ZAPIS)' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.skip_geocode != true }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--limit ${{ inputs.limit }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run geocode enrichment
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_geocode.py ${{ steps.args.outputs.args }}

  # ── KROK 2: Google Places — telefon, WWW, godziny ────────────────────────
  google:
    name: "2/3 · Google Places ${{ inputs.dry_run == true && '(DRY RUN)' || '(ZAPIS)' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: geocode
    if: ${{ always() && inputs.skip_google != true }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--limit ${{ inputs.limit }} --concurrency 5"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run Google enrichment
        working-directory: scraper
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_google.py ${{ steps.args.outputs.args }}

  # ── KROK 3: Claude AI — e-mail, rezerwacja, summary ──────────────────────
  claude:
    name: "3/3 · Claude AI ${{ inputs.dry_run == true && '(DRY RUN)' || '(ZAPIS)' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: google
    if: ${{ always() && inputs.skip_claude != true }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--limit ${{ inputs.limit }} --model ${{ inputs.claude_model }} --require-empty"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run Claude enrichment
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich.py ${{ steps.args.outputs.args }}
