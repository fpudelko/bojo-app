name: SQL (tylko odczyt)

# Uruchamia zapytanie SQL na produkcyjnej bazie i wypisuje wynik do logu.
#
# Po co: agent pracujący w tym repo nie ma sieciowego dostępu do Supabase.
# Bez tego każda diagnostyka wygląda tak, że agent pisze plik .sql, człowiek
# wkleja go do SQL Editora i odsyła wynik. Tutaj agent commituje zapytanie
# i odpala workflow sam.
#
# Bezpieczeństwo:
#   - łączy się rolą TYLKO DO ODCZYTU (sekret SUPABASE_DB_URL_RO),
#   - transakcja jest dodatkowo wymuszona jako READ ONLY,
#   - klucz nigdy nie opuszcza sekretów GitHuba.
# Setup roli i sekretu: supabase/zapytania/README.md
#
# Wymagany sekret:
#   SUPABASE_DB_URL_RO   postgresql://…  (rola bez prawa zapisu)

on:
  # Główny tryb pracy agenta: push zapytania na gałąź roboczą sam uruchamia
  # workflow. Token agenta ma prawo czytać Actions, ale NIE odpalać ich przez
  # API (`403 Resource not accessible by integration`) — push jest jedynym
  # wyzwalaczem, który agent kontroluje sam. Bez tego każde sprawdzenie stanu
  # bazy wymagałoby kliknięcia przez człowieka.
  #
  # Gałąź jest odrębna i jednorazowa, więc historia mastera zostaje czysta.
  push:
    branches: ['claude/sql/**']
    paths: ['supabase/zapytania/biezace.sql']

  workflow_dispatch:
    inputs:
      plik:
        description: 'Ścieżka do pliku .sql w repo (np. supabase/zapytania/mapa.sql)'
        required: false
        type: string
      zapytanie:
        description: 'Zapytanie SQL wprost (używane, gdy „plik" jest pusty)'
        required: false
        type: string

jobs:
  sql:
    name: SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sprawdź sekret
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_RO }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Brak sekretu SUPABASE_DB_URL_RO. Instrukcja: supabase/zapytania/README.md"
            exit 1
          fi

          # Sprawdzamy WYŁĄCZNIE hasło, nie cały kształt adresu — connection
          # string z Supabase bywa z portem, parametrami (`?sslmode=require`)
          # i bez nich, a zgadywanie pełnego wzorca kończy się odrzucaniem
          # poprawnych adresów.
          #
          # Powód, dla którego hasło musi być URI-bezpieczne, nie jest
          # kosmetyczny: przy `+`, `/` albo `=` psql nie rozpoznaje adresu jako
          # URI, przechodzi na parsowanie „klucz=wartość" i WYPISUJE FRAGMENT
          # HASŁA w komunikacie błędu. Maskowanie sekretów tego nie łapie, bo
          # to część sekretu, nie całość — hasło ląduje w publicznym logu.
          # Zdarzyło się raz; ten warunek jest po to, żeby nie zdarzyło się drugi.
          # Obcinamy TYLKO początek i koniec. `tr -d` zjadłoby spacje
          # rozdzielające pary w formacie klucz=wartość i rozwaliło adres.
          CZYSTY=$(printf '%s' "$DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          # Supabase w panelu Connect podaje adres w kilku formatach. Przyjmujemy
          # dwa, które psql rozumie:
          #   1. URI       postgresql://uzytkownik:haslo@host:port/baza
          #   2. klucz=wartość   host=… port=… user=… password=… dbname=…
          # Wariant 2 nie przechodzi przez parser URI, więc problem znaków
          # specjalnych w haśle go nie dotyczy i nie sprawdzamy go dodatkowo.
          case "$CZYSTY" in
            postgres://*|postgresql://*)
              HASLO=$(printf '%s' "$CZYSTY" | sed -E 's|^postgres(ql)?://[^:@/]+:([^@]*)@.*$|\2|')
              if [ "$HASLO" = "$CZYSTY" ] || [ -z "$HASLO" ]; then
                echo "::error::Nie umiem wyłuskać hasła z SUPABASE_DB_URL_RO — spodziewany kształt to postgresql://uzytkownik:haslo@host:port/baza"
                exit 1
              fi
              if ! printf '%s' "$HASLO" | grep -qE '^[A-Za-z0-9._~-]+$'; then
                echo "::error::Hasło w SUPABASE_DB_URL_RO ma znaki wymagające kodowania URL (+ / = : @ itp). Wygeneruj je przez 'openssl rand -hex 32' i zaktualizuj sekret — patrz supabase/zapytania/README.md"
                exit 1
              fi
              ;;
            *host=*)
              # Format klucz=wartość — psql bierze go dosłownie, bez parsowania URI.
              HASLO=$(printf '%s' "$CZYSTY" | sed -nE 's|.*password=([^ ]*).*|\1|p')
              ;;
            *)
              echo "::error::SUPABASE_DB_URL_RO nie wygląda ani na adres postgresql://…, ani na listę host=… user=… password=…. W Supabase: Connect → Session pooler → skopiuj cały adres i podmień użytkownika oraz hasło na rolę claude_ro. Instrukcja: supabase/zapytania/README.md"
              exit 1
              ;;
          esac

          # Maskowanie samego hasła, niezależnie od maskowania całego sekretu.
          # Gdyby jakiekolwiek narzędzie wypisało je w błędzie, GitHub zamieni
          # je na ***. Maska obowiązuje do końca zadania.
          if [ -n "$HASLO" ]; then echo "::add-mask::$HASLO"; fi

      - name: Przygotuj zapytanie
        env:
          ZAPYTANIE: ${{ inputs.zapytanie }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            cp supabase/zapytania/biezace.sql /tmp/zapytanie.sql
          elif [ -n "${{ inputs.plik }}" ]; then
            if [ ! -f "${{ inputs.plik }}" ]; then
              echo "::error::Nie ma pliku ${{ inputs.plik }}"
              exit 1
            fi
            cp "${{ inputs.plik }}" /tmp/zapytanie.sql
          elif [ -n "$ZAPYTANIE" ]; then
            printf '%s\n' "$ZAPYTANIE" > /tmp/zapytanie.sql
          else
            echo "::error::Podaj „plik" albo „zapytanie"."
            exit 1
          fi
          echo "--- treść zapytania ---"
          cat /tmp/zapytanie.sql
          echo "-----------------------"

      - name: Uruchom
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_RO }}
        run: |
          # Białe znaki obcinamy tu jeszcze raz, zamiast przekazywać gotowy adres
          # przez GITHUB_ENV — connection string z hasłem nie ma powodu podróżować
          # między krokami.
          # Obcinamy TYLKO początek i koniec. `tr -d` zjadłoby spacje
          # rozdzielające pary w formacie klucz=wartość i rozwaliło adres.
          CZYSTY=$(printf '%s' "$DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          # READ ONLY jako druga linia obrony — rola i tak nie ma prawa zapisu,
          # ale literówka w zapytaniu nie ma prawa niczego ruszyć.
          psql "$CZYSTY" \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            --pset=pager=off \
            --pset=footer=on \
            -c 'SET TRANSACTION READ ONLY' \
            -f /tmp/zapytanie.sql
