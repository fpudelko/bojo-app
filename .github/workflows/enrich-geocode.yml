name: Geocode Enrichment (Nominatim, bezpłatne)

# Uzupełnia adres (ul. Roosevelta 18), kod pocztowy i dzielnicę dla obiektów
# z lat/lng które nie mają tych danych. Używa Nominatim (OpenStreetMap) —
# całkowicie bezpłatne, bez klucza API.
#
# Limit: 1 zapytanie/sek → ~25 min dla 1426 obiektów.
# Uruchamia się też automatycznie w każdy poniedziałek o 4:00 UTC, żeby
# nowo dodane obiekty (z importu OSM) dostały uzupełnione dane.
#
# Wymagane sekrety repozytorium:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Co uzupełniać'
        required: false
        default: 'missing'
        type: choice
        options:
          - missing          # brakujące adresy LUB dzielnice
          - missing_district # tylko brakujące dzielnice (zachowaj adresy)
          - overwrite        # nadpisz wszystko nowym wynikiem z Nominatim
      limit:
        description: 'Maks. obiektów do przetworzenia (0 = wszystkie)'
        default: '0'
        required: false
        type: string
      dry_run:
        description: 'Tryb podglądu — wypisuje zmiany, nic nie zapisuje'
        default: true
        required: false
        type: boolean

  schedule:
    # Każdy poniedziałek 4:00 UTC — uzupełnia nowo dodane obiekty
    - cron: '0 4 * * 1'

jobs:
  geocode:
    name: >-
      Geocode
      ${{ github.event_name == 'schedule' && '(harmonogram)' || '' }}
      ${{ inputs.dry_run == true && '· DRY RUN' || '· ZAPIS' }}
      ${{ inputs.limit && inputs.limit != '0' && format('· limit={0}', inputs.limit) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          # Scheduled run: only fill in missing data, no dry-run, no limit
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "args=" >> $GITHUB_OUTPUT
            exit 0
          fi

          ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.mode }}" = "missing_district" ]; then
            ARGS="$ARGS --missing-district"
          fi
          if [ "${{ inputs.mode }}" = "overwrite" ]; then
            ARGS="$ARGS --overwrite"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run geocode enrichment
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_geocode.py ${{ steps.args.outputs.args }}
