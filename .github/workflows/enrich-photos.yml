name: Photo Enrichment

# Finds venue photos in priority order:
#   1. Google Places API — real, high-quality photos (needs GOOGLE_PLACES_API_KEY)
#   2. Wikimedia Commons  — CC-licensed photos, free (no key needed)
#   3. Mapbox satellite   — aerial fallback for every venue (needs MAPBOX_TOKEN)
#
# Stores the best URL in fields.photo_url + fields.photo_source.
#
# Required secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_PLACES_API_KEY  (optional — enables Google Photos)
#   MAPBOX_TOKEN           (optional — enables satellite fallback)

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Photo source (auto = Google → Wikimedia → satellite)'
        default: 'auto'
        required: false
        type: choice
        options:
          - auto
          - google
          - wikimedia
          - satellite
      limit:
        description: 'Max venues to process (0 = all missing photos)'
        default: '50'
        required: false
        type: string
      dry_run:
        description: 'Preview — show found URLs, do NOT write to DB'
        default: true
        required: false
        type: boolean

jobs:
  enrich-photos:
    name: >-
      Photos
      · ${{ inputs.strategy }}
      ${{ inputs.dry_run == true && '· DRY RUN' || '· ZAPIS' }}
      ${{ inputs.limit != '0' && format('· limit={0}', inputs.limit) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--strategy ${{ inputs.strategy }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.limit }}" != "0" ];     then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run photo enrichment
        working-directory: scraper
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY:     ${{ secrets.GOOGLE_PLACES_API_KEY }}
          MAPBOX_TOKEN:              ${{ secrets.MAPBOX_TOKEN }}
        run: python enrich_photos.py ${{ steps.args.outputs.args }}
