name: Fix GPS Coordinates (Forward Geocoding)

# Forward-geocodes venue addresses via Nominatim and updates coordinates
# when the stored lat/lng differs by more than --threshold km.
#
# Useful after bulk-importing manually-entered venues (seeds, spreadsheets)
# where GPS was estimated rather than verified.
#
# Required secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Min distance (km) to trigger update'
        default: '1.0'
        required: false
        type: string
      source:
        description: 'Filter by source (manual | osm | — leave blank for all)'
        default: 'manual'
        required: false
        type: string
      limit:
        description: 'Max venues to process (0 = all)'
        default: '100'
        required: false
        type: string
      dry_run:
        description: 'Preview mode — show mismatches, do NOT write to DB'
        default: true
        required: false
        type: boolean

jobs:
  fix-coords:
    name: >-
      Fix GPS
      ${{ inputs.dry_run == true && '· DRY RUN' || '· ZAPIS' }}
      ${{ inputs.source != '' && format('· source={0}', inputs.source) || '' }}
      ${{ inputs.limit != '0' && format('· limit={0}', inputs.limit) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install httpx python-dotenv

      - name: Build arguments
        id: args
        run: |
          ARGS="--threshold ${{ inputs.threshold }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.source }}" ];         then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          if [ "${{ inputs.limit }}" != "0" ];      then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run fix-coords
        working-directory: scraper
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fix_coords.py ${{ steps.args.outputs.args }}
