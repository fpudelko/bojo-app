name: Import boisk z OSM (Geofabrik, bezpłatnie)

# Pobiera regionalny wycinek OpenStreetMap z Geofabrik i importuje boiska
# do Supabase. Zero opłat i zero limitów API — w przeciwieństwie do Overpassa,
# który przy całym województwie kończy się timeoutem.
#
# Nazwy powstają ze ZŁĄCZENIA PRZESTRZENNEGO: skrypt sprawdza, w czym leży
# boisko (ośrodek sportu, szkoła, klub) i buduje nazwę z kontekstu, zamiast
# klepać „Boisko — piłka nożna". Sport i nawierzchnia pochodzą z tagów OSM.
# ŻADNEGO udziału AI.
#
# ZACZNIJ OD dry_run=true — dostaniesz sam raport w logu, bez dotykania bazy.
#
# Wymagane sekrety (tylko przy zapisie):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region Geofabrik (lubelskie, wielkopolskie, mazowieckie…)'
        default: 'lubelskie'
        required: true
        type: string
      dry_run:
        description: 'Tylko raport — nic nie zapisuje'
        default: true
        required: false
        type: boolean
      limit:
        description: 'Maks. obiektów do zapisu (0 = wszystkie)'
        default: '0'
        required: false
        type: string

jobs:
  import:
    name: >-
      Import ${{ inputs.region }}
      ${{ inputs.dry_run == true && '· RAPORT' || '· ZAPIS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Zależności
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Import
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python import_osm_pbf.py \
            --region "${{ inputs.region }}" \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
